<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ndem-aDem Control Plane</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%; margin: 0;
            background: radial-gradient(circle at center, #0a192f 0%, #020c1b 100%);
            color: #64ffda;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            display: flex; flex-direction: column;
        }
        .wrapper {
            flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .terminal-panel {
            background: rgba(10, 25, 47, 0.7);
            border: 1px solid #00bfff;
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 191, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            width: 100%; max-width: 500px; padding: 40px; margin-bottom: 20px;
        }
        h1, h2, h3 {
            color: #e6f1ff; text-align: center; margin-top: 0;
            font-weight: 600; letter-spacing: 1px;
        }
        h1, h2 {
            border-bottom: 1px solid rgba(0, 191, 255, 0.3); padding-bottom: 20px; margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 12px; color: #00bfff; letter-spacing: 0.5px; }
        input, textarea {
            width: 100%; padding: 12px 16px; background-color: rgba(2, 12, 27, 0.7);
            border: 1px solid rgba(0, 191, 255, 0.3); color: #e6f1ff;
            font-family: inherit; border-radius: 6px; resize: none; font-size: 14px;
            transition: all 0.3s ease;
        }
        input:focus, textarea:focus { outline: none; border-color: #00bfff; box-shadow: 0 0 12px rgba(0, 191, 255, 0.4); background-color: rgba(2, 12, 27, 0.9); }
        .action-btn {
            background: linear-gradient(135deg, #00bfff 0%, #0080ff 100%); color: #020c1b; border: none;
            padding: 14px; width: 100%; font-size: 15px; font-weight: 600; font-family: inherit;
            cursor: pointer; border-radius: 6px; transition: all 0.3s ease; margin-top: 15px;
            box-shadow: 0 4px 14px rgba(0, 191, 255, 0.3);
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 191, 255, 0.5); }
        .secondary-btn {
            background: transparent; color: #00bfff; border: 1px solid #00bfff; margin-top: 10px; box-shadow: none;
        }
        .secondary-btn:hover { background: rgba(0, 191, 255, 0.1); color: #e6f1ff; }
        .message-box { margin-top: 20px; padding: 12px; text-align: center; border-radius: 6px; font-size: 14px; display: none; font-weight: 500; }
        .success { background-color: rgba(0, 191, 255, 0.1); border: 1px solid #00bfff; color: #00bfff; }
        .error { background-color: rgba(255, 51, 102, 0.1); border: 1px solid #ff3366; color: #ff3366; }
        .hidden { display: none !important; }
        .info-node { border: 1px dashed rgba(0, 191, 255, 0.3); background: rgba(10, 25, 47, 0.4); padding: 15px; margin-top: 25px; border-radius: 6px; font-size: 12px; text-align: center; color: #8892b0; }
        footer {
            flex-shrink: 0; background-color: #020c1b; border-top: 1px solid rgba(0, 191, 255, 0.2);
            color: #8892b0; text-align: center; padding: 20px; font-size: 12px; width: 100%; line-height: 1.6;
        }
        footer a { color: #00bfff; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="terminal-panel" id="auth-panel">
            <h2>Ndem-aDem Gateway</h2>
            <div class="form-group">
                <label>USERNAME</label>
                
            </div>
            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" id="password" placeholder="Enter your secure token...">
            </div>
            <button class="action-btn" onclick="handleAuth('/api/login')">SIGN IN</button>
            <button class="action-btn secondary-btn" onclick="handleAuth('/api/register')">REGISTER ACCOUNT</button>
            <div class="message-box" id="msg-box"></div>
            <div class="info-node">Need support? Contact administration at <strong>auxanotech.consulting@gmail.com</strong></div>
        </div>

        <div class="terminal-panel hidden" id="dashboard-panel">
            <h1>Operative Workspace</h1>
            <p style="text-align: center; color: #8892b0; margin-bottom: 25px;">Welcome back, <strong id="user-display" style="color: #00bfff;"></strong></p>
            
            <div style="border-top: 1px solid rgba(0, 191, 255, 0.2); padding-top: 20px;">
                <h3>Update Personal Profile</h3>
                <div class="form-group">
                    <label>FULL NAME</label>
                    <input type="text" id="profile-name" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>GEOGRAPHIC LOCATION</label>
                    <input type="text" id="profile-location" placeholder="Missouri, US">
                </div>
                <div class="form-group">
                    <label>BIOGRAPHICAL DOSSIER</label>
                    <textarea id="profile-bio" rows="3" placeholder="Enter custom biography credentials..."></textarea>
                </div>
                <button class="action-btn" onclick="saveProfile()">SAVE PROFILE DETAILS</button>
                <div class="message-box" id="dash-msg-box"></div>
            </div>
            <button class="action-btn secondary-btn" onclick="logout()" style="margin-top: 25px; border-color: #ff3366; color: #ff3366;">LOGOUT FROM NODE</button>
        </div>
    </div>
    <footer>
        <div>&copy; 2026 Ndem-aDem Cluster Network. All Rights Reserved.</div>
        <div>OWNER CONTACT: <a href="mailto:auxanotech.consulting@gmail.com">auxanotech.consulting@gmail.com</a> | TEL: <a href="tel:2406151072">240-615-1072</a></div>
    </footer>

    <script>
        let currentAuthenticatedUser = "";
        function handleAuth(endpoint) {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if (!user || !pass) { showMsg("Arguments missing.", "error"); return; }
            fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            })
            .then(res => res.json().then(data => ({ status: res.status, body: data })))
            .then(res => {
                if (res.status === 200 || res.status === 201) {
                    showMsg(res.body.message, "success");
                    if (endpoint.includes('login')) {
                        currentAuthenticatedUser = user;
                        setTimeout(() => {
                            document.getElementById('auth-panel').classList.add('hidden');
                            document.getElementById('dashboard-panel').classList.remove('hidden');
                            document.getElementById('user-display').innerText = user;
                            loadProfile(); 
                        }, 1000);
                    }
                } else {
                    showMsg(res.body.error || "Authentication failed.", "error");
                }
            })
            .catch(() => showMsg("Server pipeline unreachable.", "error"));
        }

        function loadProfile() {
            fetch(`/api/profile?username=${currentAuthenticatedUser}`)
                .then(res => res.json())
                .then(data => {
                    if(!data.error) {
                        document.getElementById('profile-name').value = data.fullname || '';
                        document.getElementById('profile-location').value = data.location || '';
                        document.getElementById('profile-bio').value = data.bio || '';
                    }
                });
        }

        function saveProfile() {
            const fullname = document.getElementById('profile-name').value;
            const location = document.getElementById('profile-location').value;
            const bio = document.getElementById('profile-bio').value;
            const dashMsg = document.getElementById('dash-msg-box');
            fetch('/api/profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentAuthenticatedUser, fullname, location, bio })
            })
            .then(res => res.json())
            .then(data => {
                dashMsg.innerText = data.message || "Profile updated successfully.";
                dashMsg.style.display = "block";
                dashMsg.className = "message-box success";
                setTimeout(() => { dashMsg.style.display = "none"; }, 3000);
            })
            .catch(() => {
                dashMsg.innerText = "Error linking database.";
                dashMsg.style.display = "block";
                dashMsg.className = "message-box error";
            });
        }

        function showMsg(text, type) {
            const msgBox = document.getElementById('msg-box');
            msgBox.innerText = text; msgBox.style.display = "block";
            msgBox.className = "message-box " + type;
        }

        function logout() {
            document.getElementById('dashboard-panel').classList.add('hidden');

document.getElementById('auth-panel').classList.remove('hidden');document.getElementById('username').value = ''; document.getElementById('password').value = '';document.getElementById('msg-box').style.display = 'none';currentAuthenticatedUser = "";}
