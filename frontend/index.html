<div class="data-form">
    <label style="display: block; margin-bottom: 5px; font-weight: bold;">USERNAME</label>
    <input type="text" id="username" placeholder="Enter your username..." style="width: 100%; padding: 10px; background: #000; border: 1px solid #00ff33; color: #00ff33; font-family: inherit; margin-bottom: 15px; border-radius: 4px;">

    <label style="display: block; margin-bottom: 5px; font-weight: bold;">PASSWORD</label>
    <input type="password" id="password" placeholder="Enter your password..." style="width: 100%; padding: 10px; background: #000; border: 1px solid #00ff33; color: #00ff33; font-family: inherit; margin-bottom: 15px; border-radius: 4px;">

    <label style="display: block; margin-bottom: 5px; font-weight: bold;">SECURE TOKEN</label>
    <input type="text" id="token" placeholder="Enter your secure token..." style="width: 100%; padding: 10px; background: #000; border: 1px solid #00ff33; color: #00ff33; font-family: inherit; margin-bottom: 20px; border-radius: 4px;">
</div>
